<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Sessions</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:20px}
    table{border-collapse:collapse;width:100%;max-width:1080px}
    th,td{border:1px solid #ddd;padding:8px}
    th{background:#f4f4f4;text-align:left}
    .shots{margin-top:16px}
    .shotClip{margin:6px 0}
  </style>
  <script>
    async function loadSessions(){
      const res = await fetch('/api/sessions'); const j = await res.json();
      const list = (j.sessions||[]);
      const tbody = document.getElementById('rows'); tbody.innerHTML='';
      for (const s of list){
        const tr = document.createElement('tr');
        const dt = s.startedAt? new Date(s.startedAt).toLocaleString():'-';
        const acc = s.totals? (s.totals.accuracy||0)+'%':'';
        tr.innerHTML = `<td><a href="#" data-id="${s.id}" class="link">${s.id}</a></td><td>${dt}</td><td>${s.totals?.attempts||0}</td><td>${s.totals?.made||0}</td><td>${acc}</td>`;
        tbody.appendChild(tr);
      }
      document.querySelectorAll('a.link').forEach(a=>{
        a.addEventListener('click', async (e)=>{
          e.preventDefault(); const sid=e.target.getAttribute('data-id'); await showSession(sid);
        });
      });
    }
    async function showSession(sid){
      const res = await fetch('/api/sessions/'+sid); const s = await res.json();
      const box = document.getElementById('detail'); box.innerHTML = `<h3>Session ${s.id}</h3>`;
      const ul = document.createElement('div'); ul.className='shots';
      (s.shots||[]).forEach((sh,i)=>{
        const url = `/sessions/${s.id}/shot_${i}.webm`;
        const made = sh.made? '✅ make':'❌ miss';
        ul.innerHTML += `<div class="shotClip"><strong>Shot ${i+1}:</strong> ${made} — entry ${sh.entryAngle??'-'}°, release ${sh.releaseAngle??'-'}°<br/><video src="${url}" controls width="420"></video></div>`;
      });
      box.appendChild(ul);
    }
    window.addEventListener('DOMContentLoaded', loadSessions);
  </script>
</head>
<body>
  <h2>My Sessions</h2>
  <table>
    <thead><tr><th>ID</th><th>Started</th><th>Attempts</th><th>Made</th><th>Accuracy</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="detail"></div>
</body>
</html>
