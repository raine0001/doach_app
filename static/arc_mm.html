<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Arc & Make/Miss</title>
  <style>
    body { background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #stage { position: relative; width: 960px; aspect-ratio: 16/9; background:#000; margin-top:12px; }
    #stage > * { position:absolute; inset:0; display:block; }
    #shotList .shot { margin: 6px 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="arcmm">
    <h2>Arc & Make/Miss</h2>
    <button id="processAll">Process All</button>
    <div id="shotList"></div>

    <div id="stage">
      <video id="mmVideo" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="exportCanvas"></canvas>
    </div>
  </div>

  <script>
    // Put real, same-origin URLs here
    window.__DEMO_SHOTS = [
      { id: 101, url: "/static/media/shot-2.webm" },
      { id: 102, url: "/static/media/shot-3.webm" }
    ];
    window.__videoFPS = 30;
    // Make sure the detector worker can be found from this page
    window.DETECTOR_WORKER_PATH = "/static/js/detector.worker.js";
  </script>

  <!-- Your existing build that shims the module -->
  <script src="/static/js/shot_arc.js"></script>
  <!-- Orchestrator -->
  <script type="module" src="/static/js/arc_mm.js"></script>
</body>
</html>
