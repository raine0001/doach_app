<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Arc & Make/Miss — FBF (existing stack)</title>
  <style>
    body { background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #stage { position: relative; width: 960px; aspect-ratio: 16/9; background:#000; margin-top:12px; }
    #stage > * { position:absolute; inset:0; display:block; }
    #controls { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
    #shotList .shot { margin: 6px 0; }
    button { cursor: pointer; }
    #detTap { position:absolute; left:-99999px; top:-99999px; }
  </style>
</head>
<body>
  <div id="arcmm">
    <h2>Arc & Make/Miss (Existing FBF)</h2>

    <div id="controls">
      <button id="processAll">Process All</button>
    </div>

    <div id="shotList"></div>

    <div id="stage">
      <video id="videoPlayer" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="exportCanvas" style="position:absolute; left:-9999px"></canvas>
      <!-- detector bridge uses a DOM canvas -->
      <canvas id="detTap" width="1" height="1"></canvas>
    </div>
  </div>

  <!-- Config FIRST -->
  <script>
    window.DETECTOR_WORKER_PATH = "/static/js/detector.worker.js";
    window.DETECTOR_MODEL_URL   = "/static/models/best.onnx";
    window.SHOT_ARC_MODULE_PATH = "/static/arc_mm/shot_arc.module.js";
    window.__videoFPS           = 30;

    const sid  = "20250930_204140_927675";
    const base = `/static/arc_mm/sessions/${sid}/clips`;
    window.__DEMO_SHOTS = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1;
      return { id: `${sid}-${n}`, name: `shot-${n}.webm`, url: `${base}/shot-${n}.webm` };
    });
  </script>

  <!-- Enable local detector exactly like old index.html -->
  <script type="module">
    import '/static/js/local_detector.js';
    (async () => {
      if (!window.localDetector?.enable) return;
      try {
        const ok = await window.localDetector.enable(
          '/static/models/best.onnx',
          null,                      // let labels.json decide classes
          { conf: 0.10, imgsz: 896 } // better recall for small ball
        );
        console.log(ok ? '✅ Local detector enabled' : '⬇️ Using server detector');
        window.__DET_INIT_DONE = !!ok;
      } catch (e) { console.warn('[LocalDetector] init failed', e); }
    })();
  </script>

  <!-- Your app orchestrator (FBF analyzer, overlay, etc.) and HUD -->
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/bg_hud.js"></script>

  <!-- Page entry: composite + rim pick + feed detector with DOM canvas -->
  <script type="module" src="/static/arc_mm/arc_mm_fbf.js"></script>

  <!-- Per-frame detect: draw video onto #detTap and call the REAL bridge -->
  <script type="module">
    const video   = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const tap     = document.getElementById('detTap');

    window.addEventListener('analyzer:frame-done', () => {
      window.fidx = (window.fidx|0) + 1;

      const W = overlay.width, H = overlay.height;
      if (!W || !H) return;
      if (tap.width !== W || tap.height !== H) { tap.width = W; tap.height = H; }

      // draw current video frame to DOM canvas
      tap.getContext('2d', { willReadFrequently:true }).drawImage(video, 0, 0, W, H);

      // use the app’s bridge exactly as built
      if (typeof window.sendFrameToDetect === 'function') {
        try { window.sendFrameToDetect(tap, (window.fidx|0)); } catch {}
      }

      // heartbeat: watch object flow
      if (((window.__beat=(window.__beat||0)+1)%12)===0) {
        console.log('[det] objs:', (window.lastDetectedFrame?.objects||[]).length);
      }
    });
  </script>
</body>
</html>
