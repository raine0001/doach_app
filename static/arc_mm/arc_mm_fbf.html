<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Arc & Make/Miss — FBF (existing stack)</title>
  <style>
    body { background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #stage { position: relative; width: 960px; aspect-ratio: 16/9; background:#000; margin-top:12px; }
    #stage > * { position:absolute; inset:0; display:block; }
    #controls { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
    #shotList .shot { margin: 6px 0; }
    button { cursor: pointer; }
    /* detector tap canvas lives offscreen; we still want a DOM canvas, not OffscreenCanvas */
    #detTap { position:absolute; left:-99999px; top:-99999px; }
  </style>
</head>
<body>
  <div id="arcmm">
    <h2>Arc & Make/Miss (Existing FBF)</h2>

    <div id="controls">
      <button id="processAll">Process All</button>
    </div>

    <div id="shotList"></div>

    <div id="stage">
      <video id="videoPlayer" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="exportCanvas" style="position:absolute; left:-9999px"></canvas>
      <!-- IMPORTANT: HTMLCanvasElement for the detector bridge -->
      <canvas id="detTap" width="1" height="1"></canvas>
    </div>
  </div>

  <!-- 0) Config FIRST -->
  <script>
    window.DETECTOR_WORKER_PATH = "/static/js/detector.worker.js";
    window.DETECTOR_MODEL_URL   = "/static/models/best.onnx";
    window.SHOT_ARC_MODULE_PATH = "/static/arc_mm/shot_arc.module.js";
    window.__videoFPS           = 30;

    const sid  = "20250930_204140_927675";
    const base = `/static/arc_mm/sessions/${sid}/clips`;
    window.__DEMO_SHOTS = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1;
      return { id: `${sid}-${n}`, name: `shot-${n}.webm`, url: `${base}/shot-${n}.webm` };
    });
  </script>

  <!-- 1) Enable the local detector using original API + sane thresholds -->
  <script type="module">
    import '/static/js/local_detector.js';
    (async () => {
      if (!window.localDetector?.enable) return;
      try {
        const ok = await window.localDetector.enable(
          '/static/models/best.onnx',
          null,                                // use model's labels.json
          { conf: 0.10, imgsz: 896 }           // small-ball friendly
        );
        console.log(ok ? '✅ Local detector enabled' : '⬇️ Using server detector');
        window.__DET_INIT_DONE = !!ok;
      } catch (e) {
        console.warn('[LocalDetector] init failed; will fall back if available', e);
      }
    })();
  </script>

  <!-- 2) Normalize detector results from either MessagePort or Worker into lastDetectedFrame -->
  <script type="module">
    function normalize(arr){
      return arr.map(o=>{
        const label = (o.label ?? o.class ?? o.cls ?? o.name ?? '').toString().toLowerCase();
        const conf  = o.conf ?? o.score ?? o.prob ?? null;
        const bb    = o.box || o.bbox;
        if (Array.isArray(bb) && bb.length===4) { const [x1,y1,x2,y2]=bb; return { label, box:[x1,y1,x2,y2], conf }; }
        if ([o.x,o.y,o.w,o.h].every(Number.isFinite)) { return { label, box:[o.x,o.y,o.x+o.w,o.y+o.h], conf }; }
        if (Array.isArray(o.xyxy) && o.xyxy.length===4) { const [x1,y1,x2,y2]=o.xyxy; return { label, box:[x1,y1,x2,y2], conf }; }
        return null;
      }).filter(Boolean);
    }
    function handleDetMsg(ev){
      const d = ev?.data || {};
      if (d.type === 'ready' || d.type === 'detector:ready' || d.type === 'detector:ep' || d.type === 'info') {
        window.__DET_INIT_DONE = true;
      }
      const raw = Array.isArray(d.objects) ? d.objects
               : Array.isArray(d.detections) ? d.detections
               : Array.isArray(d.dets) ? d.dets
               : Array.isArray(d.boxes) ? d.boxes
               : (d.data && (d.data.objects||d.data.detections||d.data.dets||d.data.boxes)) || null;
      if (Array.isArray(raw)) {
        const objs = normalize(raw);
        if (objs.length) window.lastDetectedFrame = { __frameIdx:(window.fidx|0), objects: objs, poses: [] };
      }
    }

    // Hook both message channels ONCE
    if (!window.__DET_PORT_HOOK) {
      window.__DET_PORT_HOOK = true;

      // MessagePort: tee all messages
      const _add = MessagePort.prototype.addEventListener;
      MessagePort.prototype.addEventListener = function(type, listener, opts){
        if (type === 'message') {
          const tee = (ev)=>{ try{ handleDetMsg(ev); }catch{} return listener.call(this, ev); };
          return _add.call(this, type, tee, opts);
        }
        return _add.call(this, type, listener, opts);
      };

      // Worker.postMessage: catch transferred ports and init them
      const _wpm = Worker.prototype.postMessage;
      Worker.prototype.postMessage = function(msg, transfer){
        try {
          if (transfer && transfer.length) {
            for (const t of transfer) {
              if (t && typeof t.postMessage === 'function' && typeof t.start === 'function') {
                try { t.addEventListener('message', handleDetMsg, { passive:true }); t.start(); } catch {}
                window.__detectorPort = t;
              }
            }
          }
        } catch {}
        return _wpm.call(this, msg, transfer);
      };

      // Worker constructor: listen on main channel too
      const ORIG = window.Worker;
      window.Worker = function(url, opts){
        const w = new ORIG(url, opts);
        if (/detector|local|microclip|worker\.js/i.test(String(url||''))) {
          console.log('[hook] intercept:', String(url));
          window.__detectorWorker = w;
          w.addEventListener('message', handleDetMsg, { passive:true });
        }
        return w;
      };
    }

    // Send one frame per FBF tick using the REAL bridge (HTMLCanvasElement)
    const video   = document.getElementById('videoPlayer');
    const overlay = document.getElementById('overlay');
    const detTap  = document.getElementById('detTap');

    window.addEventListener('analyzer:frame-done', () => {
      window.fidx = (window.fidx|0) + 1;                      // some builds expect this

      const W = overlay.width, H = overlay.height;
      if (!W || !H) return;

      // Always use a DOM canvas for the bridge
      if (detTap.width !== W || detTap.height !== H) {
        detTap.width = W; detTap.height = H;
      }
      const ctx = detTap.getContext('2d', { willReadFrequently:true });
      ctx.drawImage(video, 0, 0, W, H);

      if (typeof window.sendFrameToDetect === 'function') {
        try { window.sendFrameToDetect(detTap, (window.fidx|0)); } catch {}
      }
      // heartbeat: see object count without spam
      if (((window.__detBeat=(window.__detBeat||0)+1)%12)===0) {
        console.log('[det] objs:', (window.lastDetectedFrame?.objects||[]).length);
      }
    });
  </script>

  <!-- 3) Your orchestrator (FBF + record + rim pick) and the HUD that draws boxes -->
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/bg_hud.js"></script>
  <script type="module" src="/static/arc_mm/arc_mm_fbf.js"></script>
</body>
</html>
