<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Arc FBF – Results Renderer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root {
            color-scheme: dark;
        }

        /* App chrome */
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0b0c0e;
            color: #e9eef7;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #1a1d22;
            position: sticky;
            top: 0;
            background: #0b0c0e;
            z-index: 5;
        }

        .btn {
            border: 1px solid #2a2f37;
            background: #121418;
            color: #e9eef7;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: default;
        }

        /* Layout */
        .wrap {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 16px;
            padding: 16px;
        }

        /* Stage: lock aspect to prevent layout pop. JS will update --ar when known. */
        .stage {
            --ar: 16/9;
            /* safe default until metadata arrives */
            position: relative;
            background: #0e1014;
            border: 1px solid #1a1d22;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: var(--ar);
            min-height: 320px;
            /* guard for narrow viewports */
            contain: layout paint;
            /* keep reflow drama inside */
        }

        /* Pixel layers */
        .stage>video,
        .stage>canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* don’t stretch while we wait for sizing */
            display: block;
        }

        /* Interaction priority: overlay gets the clicks, video stays quiet */
        #videoPlayer {
            pointer-events: none;
        }

        #overlay {
            pointer-events: auto;
            z-index: 2;
        }

        /* Keep export canvas rendered and sized for captureStream, but invisible */
        #exportCanvas {
            visibility: hidden;
            pointer-events: none;
            z-index: 1;
        }

        /* Shots list */
        #shotList {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 90px);
            overflow: auto;
        }

        .shot {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0e1014;
            border: 1px solid #1a1d22;
            border-radius: 10px;
            padding: 10px;
        }

        .shot .name {
            opacity: 0.8;
        }

        .shot .status {
            margin-left: auto;
            opacity: 0.8;
        }

        .shot video {
            margin-top: 6px;
            max-width: 360px;
            border-radius: 8px;
            border: 1px solid #1a1d22;
        }

        .hud-note {
            opacity: 0.7;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <header>
        <button id="processAll" class="btn">Process All</button>
        <span class="hud-note">Autolocking rim; no user input required.</span>
    </header>

    <div class="wrap">
        <div class="stage" id="stage">
            <video id="videoPlayer" playsinline muted preload="metadata"></video>
            <canvas id="overlay"></canvas>
            <canvas id="exportCanvas"></canvas>
        </div>
        <div id="shotList"></div>
    </div>

    <script>
        /* Worker + model config consumed by fix_overlay_display.js */
        window.DETECTOR_WORKER_PATH = '/static/arc_mm/detector.worker.js';
        window.DETECTOR_MODEL_URL = '/static/models/best.onnx';
        window.DETECTOR_LABELS = ['basketball', 'hoop', 'net', 'backboard', 'player', 'rim'];


        /* Defer shot_logger’s built-in FE summary so we can feed it the prox tail */
        window.DEFER_FE_SUMMARY = true;

        /* One-time: when metadata lands, set the CSS aspect-ratio to the real one.
            Your JS sizing will still set canvas pixel sizes; this just prevents
            the initial layout jump and reflows. */
        (function lockStageAspectOnce() {
            const v = document.getElementById('videoPlayer');
            const stage = document.getElementById('stage');
            if (!v || !stage) return;
            const setAR = () => {
                const vw = v.videoWidth | 0, vh = v.videoHeight | 0;
                if (vw && vh) stage.style.setProperty('--ar', `${vw}/${vh}`);
            };
            if (v.readyState >= 1) setAR();
            else v.addEventListener('loadedmetadata', setAR, { once: true });
        })();
    </script>

    <script type="module">
        /* ---------- minimal imports ---------- */
        import * as Analyzer from '/static/js/analyzer.js';
        import { sendFrameToDetect as detect } from '/static/js/fix_overlay_display.js';
        import * as Hoop from '/static/js/hoop_tracker.js';
        import * as ShotArcMod from '/static/arc_mm/shot_arc.module.js';
        import * as ShotLogMod from '/static/js/shot_logger.js';

        /* ---------- FBF pacing config (no UI references here) ---------- */
        // How many VIDEO FRAMES you want to step per second of WALL time.
        // For true frame-by-frame on a 30 fps clip, set 30 so we step by 1/30s each tick.
        const FBF_ANALYSIS_FPS = 30;     // default analysis fps if we can't detect/aren't told
        const FBF_WALL_MS = 333;   // 1000 = visibly 1 fps; use 333 for ~3× faster

        // Derive seconds of VIDEO advanced per tick.
        // If you know the clip fps, set video.dataset.fps = "30" in the pipeline.
        // Otherwise we use FBF_ANALYSIS_FPS.
        function getStepSec(videoEl) {
            const hinted = Number(videoEl?.dataset?.fps);
            const fps = Number.isFinite(hinted) && hinted > 0 ? hinted : FBF_ANALYSIS_FPS;
            return 1 / fps;
        }


        /* ---------- demo list (replace with server later) ---------- */
        const g = window;
        const demoSid = "20250930_204140_927675";
        const demoBase = `/static/arc_mm/sessions/${demoSid}/clips`;
        const demoShots = Array.from({ length: 10 }, (_, i) => {
            const n = i + 1;
            return { id: `${demoSid}-${n}`, name: `shot-${n}.webm`, url: `${demoBase}/shot-${n}.webm` };
        });
        const SHOTS = (() => {
            const override = (g.arcmmRunner && Array.isArray(g.arcmmRunner.shots)) ? g.arcmmRunner.shots
                : (Array.isArray(g.SHOTS) ? g.SHOTS : null);
            if (override && override.length) return override;
            return demoShots;
        })();

        /* ---------- bridge to window (idempotent, no clobbering) ---------- */
        // Helper: pick first defined function from a list
        const pickFn = (...fns) => fns.find(fn => typeof fn === 'function') || null;

        // Resolve module exports exactly once
        const analyzeFrames = pickFn(
            Analyzer?.analyzeVideoFrameByFrame,
            Analyzer?.default?.analyzeVideoFrameByFrame
        );
        const stopAnalysis = pickFn(
            Analyzer?.stopFrameAnalysis,
            Analyzer?.default?.stopFrameAnalysis
        );
        const detectFrame = detect || null;

        const hoopPick = pickFn(Hoop?.handleHoopSelection, Hoop?.default?.handleHoopSelection);
        const hoopLocked = pickFn(Hoop?.getLockedHoopBox, Hoop?.default?.getLockedHoopBox);

        // shot arc tools (may be a default export namespace or named exports)
        const SA = ShotArcMod?.default || ShotArcMod || {};
        const arcAPI = {
            resetShotFSM: pickFn(SA.resetShotFSM),
            refineBallTrajectory: pickFn(SA.refineBallTrajectory),
            updateArc: pickFn(SA.updateArc),
            updateShotArcTick: pickFn(SA.updateShotArcTick)
        };

        // shot logger (handle default function export or namespace)
        const summarize = pickFn(
            ShotLogMod?.summarize,
            ShotLogMod?.summarizeShot,
            ShotLogMod?.default?.summarize,
            ShotLogMod?.default?.summarizeShot,
            ShotLogMod?.results,
            ShotLogMod?.default?.results,
            (typeof ShotLogMod === 'function') ? ShotLogMod : null,
            (typeof ShotLogMod?.default === 'function') ? ShotLogMod.default : null
        );

        // Only set on window if not already set (no clobber)
        if (!g.analyzeVideoFrameByFrame && analyzeFrames) g.analyzeVideoFrameByFrame = analyzeFrames;
        if (!g.stopFrameAnalysis && stopAnalysis) g.stopFrameAnalysis = stopAnalysis;
        if (!g.sendFrameToDetect && detectFrame) g.sendFrameToDetect = detectFrame;

        if (!g.handleHoopSelection && hoopPick) g.handleHoopSelection = hoopPick;
        if (!g.getLockedHoopBox && hoopLocked) g.getLockedHoopBox = hoopLocked;

        // shotArc namespace: create once, fill missing methods only
        g.shotArc = g.shotArc || Object.create(null);
        for (const [k, fn] of Object.entries(arcAPI)) {
            if (fn && !g.shotArc[k]) g.shotArc[k] = fn;
        }

        // shotLogger namespace: create once, set summarize if absent
        g.shotLogger = g.shotLogger || Object.create(null);
        if (summarize && !g.shotLogger.summarize) g.shotLogger.summarize = summarize;
        const summarizeAndLog = pickFn(
            ShotLogMod?.results,
            ShotLogMod?.default?.results,
            (typeof ShotLogMod === 'function') ? ShotLogMod : null,
            (typeof ShotLogMod?.default === 'function') ? ShotLogMod.default : null
        );
        if (summarizeAndLog && !g.shotLogger.results) g.shotLogger.results = summarizeAndLog;
        try {
            console.log('[bridge] shotLogger wired', {
                summarize: !!g.shotLogger?.summarize,
                results: !!g.shotLogger?.results
            });
        } catch { }

        // Minimal sanity logs (quiet unless something’s missing)
        if (!g.analyzeVideoFrameByFrame) console.warn('[bridge] analyzeVideoFrameByFrame not available');
        if (!g.sendFrameToDetect) console.warn('[bridge] detector not available');
        if (!g.handleHoopSelection) console.warn('[bridge] handleHoopSelection not available');
        if (!g.getLockedHoopBox) console.warn('[bridge] getLockedHoopBox not available');
        if (!g.shotLogger?.summarize) console.warn('[bridge] shotLogger.summarize not available');


        /* ---------- dom (strict, idempotent) ---------- */
        function must(id) {
            const el = document.getElementById(id);
            if (!el) throw new Error(`Missing required element #${id}`);
            return el;
        }

        const ui = (window.__uiRefs) || Object.freeze({
            stage: document.getElementById('stage') || null, // optional, used for aspect CSS
            list: must('shotList'),
            video: must('videoPlayer'),
            overlay: must('overlay'),
            exportCan: must('exportCanvas'),
            processAllBtn: must('processAll'),
        });
        window.__uiRefs = ui; // cache so hot-reloads don’t reallocate

        /* ---------- canvas sizing helpers ---------- */
        function sizeCanvasesToVideo(v = ui.video) {
            const vw = v.videoWidth | 0, vh = v.videoHeight | 0;
            if (!vw || !vh) return false;

            // Slight DPR bump for sharper lines without going overboard
            const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));

            [ui.overlay, ui.exportCan].forEach(c => {
                const pw = Math.round(vw * dpr);
                const ph = Math.round(vh * dpr);
                if (c.width !== pw || c.height !== ph) {
                    c.width = pw; c.height = ph;
                }
                c.style.width = '100%';
                c.style.height = '100%';
                // prime context once so later getContext calls don’t allocate repeatedly
                c.getContext('2d', { willReadFrequently: true });
            });

            // Optional: lock CSS aspect so layout doesn’t jump (if you have #stage)
            try { ui.stage?.style?.setProperty?.('--ar', `${vw}/${vh}`); } catch { }

            return true;
        }

        // Call exactly once when metadata lands (no duplicate listeners)
        (function bindMetaOnce() {
            if (ui.video.__metaBound) return; ui.video.__metaBound = true;
            const onMeta = () => { sizeCanvasesToVideo(ui.video); };
            if (ui.video.readyState >= 1) onMeta();
            else ui.video.addEventListener('loadedmetadata', onMeta, { once: true });
        })();


        /* ---------- utils ---------- */
        function normalizeDetections(res) {
            const raw = res?.objects || res?.detections || res?.boxes || res || [];
            const out = [];
            for (const o of raw) {
                const label = (o.label || o.class || o.name || '').toString().toLowerCase();
                const conf = Number(o.confidence ?? o.score ?? o.prob ?? o.probability ?? 0);
                let box = o.box || o.bbox || o.rect || null;
                if (Array.isArray(box) && box.length === 4) {
                    const [a, b, c, d] = box; box = (c < a || d < b) ? [a, b, a + c, b + d] : [a, b, c, d];
                } else if (box && typeof box === 'object') {
                    const x = box.x ?? box.left ?? 0, y = box.y ?? box.top ?? 0;
                    const w = box.w ?? box.width ?? ((box.right ?? 0) - x);
                    const h = box.h ?? box.height ?? ((box.bottom ?? 0) - y);
                    box = [x, y, x + w, y + h];
                } else {
                    const x = o.x ?? o.cx, y = o.y ?? o.cy, w = o.w ?? o.width, h = o.h ?? o.height;
                    if ([x, y, w, h].every(Number.isFinite)) box = [x - w / 2, y - h / 2, x + w / 2, y + h / 2];
                    else continue;
                }
                out.push({ label, confidence: conf, box });
            }
            return out;
        }

        async function ensureVideoReady(v) {
            if (!v) throw new Error('no video');
            if (v.readyState >= 1 && Number.isFinite(v.duration)) return v;

            await new Promise((resolve) => {
                let done = false;
                const finish = () => { if (done) return; done = true; cleanup(); resolve(); };
                const cleanup = () => {
                    v.removeEventListener('loadedmetadata', onMeta);
                    v.removeEventListener('loadeddata', onData);
                };
                const onMeta = () => finish();
                const onData = () => finish();

                v.addEventListener('loadedmetadata', onMeta, { once: true });
                v.addEventListener('loadeddata', onData, { once: true });

                // hard ceiling; we’ll proceed even if the browser is sulking
                setTimeout(finish, 2000);
            });

            return v;
        }


        async function seekVideoTime(v, t, tol = 0.015, timeout = 2500) {
            await ensureVideoReady(v);
            lockViewOnce(v, ui.overlay);
            try { v.pause?.(); } catch { }

            t = Number.isFinite(t) ? Math.max(0, Math.min(v.duration - 0.001, t)) : 0;

            await new Promise((resolve) => {
                let done = false;
                const good = () => Math.abs(v.currentTime - t) <= tol;

                const finish = () => {
                    if (done) return; done = true;
                    v.removeEventListener('seeked', on);
                    v.removeEventListener('timeupdate', on);
                    resolve();
                };

                const on = () => { if (good()) finish(); };

                v.addEventListener('seeked', on);
                v.addEventListener('timeupdate', on);

                v.__setCurrentTimeSafely ? v.__setCurrentTimeSafely(t) : (v.currentTime = t);
                setTimeout(finish, timeout);
            });

            // settle the frame into the compositor
            await new Promise(r => requestAnimationFrame(r));
            await new Promise(r => requestAnimationFrame(r));
            return v.currentTime;
        }


        function syncSizesOnce() {
            const vw = ui.video.videoWidth | 0, vh = ui.video.videoHeight | 0;
            if (!vw || !vh) return false;

            const dpr = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
            [ui.overlay, ui.exportCan].forEach(c => {
                const pw = Math.round(vw * dpr);
                const ph = Math.round(vh * dpr);
                if (c.width !== pw || c.height !== ph) {
                    c.width = pw; c.height = ph;
                }
                c.style.width = '100%';
                c.style.height = '100%';
                // prime once to avoid reallocation churn later
                c.getContext('2d', { willReadFrequently: true });
            });

            return true;
        }


        function getHoopInVideoSpace() {
            const H = g.getLockedHoopBox?.(); if (!H) return null;
            const ov = ui.overlay, rect = ov.getBoundingClientRect();
            const sx = ov.width / rect.width, sy = ov.height / rect.height;
            const needs = (H.x != null && H.w != null && H.x + H.w > ov.width * 1.05) || (H.y != null && H.h != null && H.y + H.h > ov.height * 1.05);
            if (!needs) return H;
            const N = { ...H };
            ['x', 'w', 'cx'].forEach(k => { if (N[k] != null) N[k] *= sx; });
            ['y', 'h', 'cy', 'rimY'].forEach(k => { if (N[k] != null) N[k] *= sy; });
            if (N.netBox) {
                const n = { ...N.netBox };
                ['x', 'w', 'cx'].forEach(k => { if (n[k] != null) n[k] *= sx; });
                ['y', 'h', 'cy'].forEach(k => { if (n[k] != null) n[k] *= sy; });
                N.netBox = n;
            }
            return N;
        }

        function drawHoopBox(ctx) {
            const H = getHoopInVideoSpace(); if (!H) return;
            const x = H.x ?? (H.cx - H.w / 2), y = H.y ?? (H.cy - H.h / 2);
            ctx.save();
            ctx.strokeStyle = 'rgba(255,60,60,0.9)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, H.w, H.h);
            if (H.netBox) {
                const n = H.netBox, nx = n.x ?? (n.cx - n.w / 2), ny = n.y ?? (n.cy - n.h / 2);
                ctx.strokeStyle = 'rgba(0,180,255,0.9)'; ctx.lineWidth = 1.5; ctx.strokeRect(nx, ny, n.w, n.h);
            }
            ctx.restore();
        }

        function drawHoopTube(ctx) {
            const H = getHoopInVideoSpace(); if (!H) return;
            const cx = H.cx ?? (H.x + H.w / 2), cy = H.cy ?? (H.y + H.h / 2);
            const rimY = H.rimY ?? cy;
            const tubeW = Math.max(24, Math.round((H.w ?? 80) * 0.45));
            const tubeH = Math.max(40, Math.round((H.h ?? 80) * 1.10));
            const x = Math.round(cx - tubeW / 2), y = Math.round(rimY);
            ctx.save(); ctx.strokeStyle = 'rgba(0,180,255,0.9)'; ctx.lineWidth = 2; ctx.strokeRect(x, y, tubeW, tubeH); ctx.restore();
        }

        function drawArcOverlay(ctx) {
            const arc = window.ballArc || {};
            const frozen = arc.refinedTrailFrozen;
            const current = (arc.refinedTrail && arc.refinedTrail.length) ? arc.refinedTrail : (arc.trail || []);
            const trail = (frozen && frozen.length) ? frozen : current;
            if (!trail || !trail.length) return;

            ctx.save();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'rgba(255,165,0,0.95)';
            ctx.beginPath(); ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = 1; i < trail.length; i++) ctx.lineTo(trail[i].x, trail[i].y);
            ctx.stroke();
            ctx.restore();
        }


        function drawHUD(ctx) {
            const s = g.__lastSummary || {};
            const deg = n => typeof n === 'number' ? `${Math.round(n)}°` : '—';
            const num = n => (typeof n === 'number' && isFinite(n)) ? Math.round(n) : '—';
            const line1 = `Result: ${s.made === true ? 'MAKE' : s.made === false ? 'MISS' : '—'}`;
            const line2 = `Release ${deg(s.releaseAngle)}  •  Entry ${deg(s.entryAngle)}  •  Apex ${num(s.apexHeight)}`;
            const pad = 10, fs = 16, ctxFont = `600 ${fs}px system-ui,sans-serif`;
            ctx.save(); ctx.font = ctxFont;
            const w1 = ctx.measureText(line1).width, w2 = ctx.measureText(line2).width;
            const boxW = Math.max(w1, w2) + pad * 2, boxH = fs * 2 + pad * 3;
            ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(pad, pad, boxW, boxH);
            ctx.fillStyle = '#fff'; ctx.fillText(line1, pad * 1.6, pad * 1.8 + fs * 0.1); ctx.fillText(line2, pad * 1.6, pad * 2.6 + fs);
            ctx.restore();
        }

        (function freezeOnEnd() {
            if (window.__freezeOnEndWired) return; window.__freezeOnEndWired = true;
            function snap() { try { freezeArcTrail(); } catch { } }
            window.addEventListener('shot:end', snap, { once: false });
            window.addEventListener('shot:summary', snap, { once: false });
        })();




        let __exportCtx = null;
        function compositeFrame() {
            const w = ui.exportCan.width, h = ui.exportCan.height; if (!w || !h) return;
            const ctx = (__exportCtx ||= ui.exportCan.getContext('2d'));
            ctx.clearRect(0, 0, w, h);
            ctx.drawImage(ui.video, 0, 0, w, h);
            drawHoopBox(ctx);
            drawHoopTube(ctx);
            ctx.drawImage(ui.overlay, 0, 0, w, h);
            drawArcOverlay(ctx);
            drawHUD(ctx);
        }

        // Known clip length: 3s @ 30 fps = 90 frames
        const FBF_KNOWN_TOTAL_FRAMES = 90;

        // deep clone utility for trails
        function cloneTrail(trail) {
            return Array.isArray(trail) ? trail.map(p => ({ ...p })) : [];
        }

        // freeze the currently best trail for rendering
        function freezeArcTrail() {
            const arc = (window.ballArc ||= {});
            let live = (Array.isArray(arc.refinedTrail) && arc.refinedTrail.length)
                ? arc.refinedTrail
                : (Array.isArray(arc.trail) ? arc.trail : []);

            if (!live.length && Array.isArray(window.ballState?.trail) && window.ballState.trail.length) {
                live = window.ballState.trail.map((p, idx) => ({
                    x: p.x,
                    y: p.y,
                    frame: Number.isFinite(p.frame) ? p.frame : idx
                }));
            }

            if (live && live.length) {
                arc.refinedTrailFrozen = cloneTrail(live);
            }
        }




        /* ---------- recorder (robust) ---------- */
        function startCompositeRecorder(canvas, { fps = 30, timesliceMs = 250, videoBitsPerSecond = 4_000_000 } = {}) {
            // 1) Basic capability checks
            if (!canvas || typeof canvas.captureStream !== 'function') {
                console.warn('[rec] canvas.captureStream not supported');
                return { rec: null, done: Promise.resolve(null), stop: async () => null, url: null };
            }
            if (!canvas.width || !canvas.height) {
                console.warn('[rec] canvas has zero size; refusing to record');
                return { rec: null, done: Promise.resolve(null), stop: async () => null, url: null };
            }

            // 2) Pick a sane mime
            const mimeCandidates = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm'
            ];
            const mime = mimeCandidates.find(m => MediaRecorder.isTypeSupported?.(m)) || 'video/webm';

            // 3) Build stream and try to set requested FPS on the track
            const stream = canvas.captureStream(Math.max(1, Math.round(fps)));
            try {
                const [track] = stream.getVideoTracks();
                const supported = track?.getCapabilities?.() || {};
                if (track?.applyConstraints && supported.frameRate) {
                    const desired = Math.min(Math.max(supported.frameRate.min || 1, fps), supported.frameRate.max || fps);
                    (async () => {
                        try {
                            await track.applyConstraints({ frameRate: desired });
                        } catch (e) {
                            // Non-fatal; some browsers don’t allow changing frameRate
                            // console.debug('[rec] applyConstraints frameRate failed:', e);
                        }
                    })();
                }
            } catch (e) {
                // Non-fatal; some browsers don’t allow changing frameRate
                // console.debug('[rec] applyConstraints frameRate failed:', e);
            }

            // 4) Create recorder
            let rec;
            try {
                rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond });
            } catch (e) {
                console.error('[rec] MediaRecorder ctor failed:', e);
                return { rec: null, done: Promise.resolve(null), stop: async () => null, url: null };
            }

            // 5) Collect chunks
            const chunks = [];
            rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

            // 6) Done promise resolves to a Blob and object URL
            const done = new Promise((resolve) => {
                rec.onstop = () => {
                    try {
                        const blob = chunks.length ? new Blob(chunks, { type: mime }) : null;
                        resolve(blob);
                    } catch (e) {
                        console.error('[rec] build blob failed:', e);
                        resolve(null);
                    }
                };
            });

            // 7) Start with timeslice so we don’t buffer forever
            try { rec.start(Math.max(0, timesliceMs | 0)); } catch (e) {
                console.error('[rec] start failed:', e);

                const rawReleaseAngle = summary?.releaseAngle ?? summaryFromShotLogger?.releaseAngle ?? null;

                const rawApexHeight = summary?.apexHeight ?? summaryFromShotLogger?.apexHeight ?? null;
                const releaseAngle = toDegrees(rawReleaseAngle);
                const entryAngle = toDegrees(rawEntryAngle);
                const apexHeight = toNumber(rawApexHeight);
                if (summary) {
                    if (releaseAngle != null) summary.releaseAngle = releaseAngle;
                    if (entryAngle != null) summary.entryAngle = entryAngle;
                    if (apexHeight != null) summary.apexHeight = apexHeight;
                }

                try {
                    const hoopDebug = hoop ? {
                        x: hoop.x ?? null,
                        y: hoop.y ?? null,
                        w: hoop.w ?? null,
                        h: hoop.h ?? null,
                        cx: hoop.cx ?? null,
                        cy: hoop.cy ?? null,
                        rimY: hoop.rimY ?? null
                    } : null;
                    console.log('[arc-mm] shot summary', {
                        shotId: id,
                        via: summaryFromShotLogger ? 'shot_logger' : 'fallback',
                        summaryFromShotLogger,
                        appliedSummary: summary,
                        releaseAngle,
                        entryAngle,
                        apexHeight,
                        trailPoints: shotTrail.length,
                        lastTrailFrame,
                        frameIndexForSummary,
                        hoopROI: hoopDebug,
                        proxTailFrames: Array.isArray(proxTail) ? proxTail.length : 0
                    });
                } catch { }

                window.__lastSummary = summary;

                // render a few final HUD frames with the frozen trail
                for (let i = 0; i < 8; i++) { compositeFrame(); await new Promise(r => requestAnimationFrame(r)); }

                // if shot_logger didn't emit an event, broadcast once here
                try {
                    if (!window.__lastSummaryEmitted) window.__lastSummaryEmitted = new WeakSet();
                } catch { }
                const needsSummaryEvent = (() => {
                    try {
                        const lock = window.__lastSummaryEmitted;
                        if (!lock || typeof lock.has !== 'function' || typeof lock.add !== 'function') return !window.__lastSummaryEventSent;
                        if (summary && !lock.has(summary)) {
                            lock.add(summary);
                            return true;
                        }
                        return false;
                    } catch { return !window.__lastSummaryEventSent; }
                })();
                if (summary && needsSummaryEvent) {
                    try {
                        window.__lastSummaryEventSent = true;
                        window.dispatchEvent(new CustomEvent('shot:summary', { detail: summary }));
                    } catch { }
                }

                // stop recorder and attach preview + status
                try {
                    const { blob, url, revoke } = await (recHandle?.stop?.() || Promise.resolve({}));
                    const overlayName = `${outBasename || id || 'shot'}.results.webm`;
                    const resultDetail = {
                        id,
                        outBasename,
                        summary,
                        hoop,
                        proxTail,
                        trail: shotTrail,
                        arcTrailFrozen: Array.isArray(arc?.refinedTrailFrozen) ? cloneTrail(arc.refinedTrailFrozen) : null,
                        overlay: {
                            name: overlayName,
                            url,
                            mime: blob?.type || null,
                            blob,
                        },
                    };
                    try { window.arcmmRunner?.onResult?.(resultDetail); } catch { }
                    try { window.dispatchEvent(new CustomEvent('arcmm:result', { detail: resultDetail })); } catch { }
                    const row = document.querySelector(`[data-shot="${id}"]`);
                    if (url && row) {
                        const a = document.createElement('a'); a.href = url;
                        a.download = overlayName; a.textContent = 'Download';
                        const pv = document.createElement('video');
                        pv.src = url; pv.controls = true; pv.muted = true; pv.style.maxWidth = '360px'; pv.style.display = 'block';
                        row.appendChild(document.createTextNode(' · '));
                        row.appendChild(a); row.appendChild(document.createElement('br')); row.appendChild(pv);
                        pv.addEventListener('loadeddata', () => revoke?.(), { once: true });
                    }
                    const st = document.querySelector(`[data-shot="${id}"] .status`);
                    if (st) st.textContent = summary.made === true ? '✓ MAKE' : summary.made === false ? '✗ MISS' : '—';
                } catch { }
            }

            // fire exactly once
            const removeFinishListeners = () => {
                try { window.removeEventListener('shot:summary', onSummaryFinish); } catch { }
                try { window.removeEventListener('shot:end', onEndFinish); } catch { }
            };

            const finishIfAllowed = (via = 'unknown', detail) => {
                if (requireFullRun) {
                    const viaTag = String(via || (detail?.via ?? '') || '').toLowerCase();
                    if (viaTag !== 'fbf-90' && viaTag !== 'frame-limit' && viaTag !== 'arcmm-result') return;
                }
                removeFinishListeners();
                finishNow(via);
            };

            const onSummaryFinish = (ev) => finishIfAllowed('summary', ev?.detail);
            const onEndFinish = (ev) => {
                const via = ev?.detail?.via || 'end';
                finishIfAllowed(via, ev?.detail);
            };

            window.addEventListener('shot:summary', onSummaryFinish);
            window.addEventListener('shot:end', onEndFinish);

            // 8) run deterministic FBF driver (uses getStepSec(video) internally)
            window.__fbfDriver = makeFbfDriver(v, ui.overlay, { wallMs: FBF_WALL_MS });
            window.__fbfDriver.start();

        }

        // ========= arc_mm: permanent detector + trail feed =========
        (function installArcFbf() {
            const v = document.getElementById('videoPlayer') || document.querySelector('video');
            if (!v) return;

            // === FBF per-frame ingest: detect on RAW VIDEO → write trail, draw compositor ===
            const cap = (window.__videoCanvas ||= document.createElement('canvas'));
            const capCtx = cap.getContext('2d', { willReadFrequently: true });

            function _center(o, W, H){
            let x=o.x??o.left??o.box?.x??o.bbox?.x, y=o.y??o.top??o.box?.y??o.bbox?.y;
            let w=o.w??o.width??o.box?.w??o.bbox?.w, h=o.h??o.height??o.box?.h??o.bbox?.h;
            if (o.right!=null && o.left!=null && o.bottom!=null && o.top!=null){ x=o.left; y=o.top; w=o.right-o.left; h=o.bottom-o.top; }
            if (Array.isArray(o.bbox) && o.bbox.length===4){
                const [a,b,c,d]=o.bbox;
                if (c<=1 && d<=1){ x=a*W; y=b*H; w=c*W; h=d*H; }
                else if (c>a && d>b){ x=a; y=b; w=c-a; h=d-b; }
                else { x=a; y=b; w=c; h=d; }
            }
            if (w<=1 && h<=1 && x<=1 && y<=1){ x*=W; y*=H; w*=W; h*=H; }
            const cx=(o.cx??o.centerX??(x+w/2)), cy=(o.cy??o.centerY??(y+h/2));
            return {cx,cy};
            }

            async function onFrame(){
            // start recorder and composite what you already draw
            if (!started) { recHandle = startCompositeRecorder(ui.exportCan, { fps: 30, timesliceMs: 200 }); started = true; }
            compositeFrame();

            // copy the RAW VIDEO frame (not the overlay) into the capture canvas
            const v = ui.video;
            cap.width  = v.videoWidth  || ui.overlay.width  || 1280;
            cap.height = v.videoHeight || ui.overlay.height || 720;
            try { capCtx.drawImage(v, 0, 0, cap.width, cap.height); } catch {}

            // detect ball and push one trail point now
            try {
                const raw = await window.sendFrameToDetect?.(cap, 1);
                const arr = Array.isArray(raw) ? raw : (raw?.objects || raw?.detections || []);
                const ball = arr.find(o => /(basket|ball)/i.test(String(o.label||o.class||o.name)));
                if (ball) {
                const { cx, cy } = _center(ball, cap.width, cap.height);
                if (Number.isFinite(cx) && Number.isFinite(cy)) {
                    const t = (window.__ballTrail ||= []);
                    t.push({ x: cx, y: cy, t: performance.now() });
                    if (t.length > 180) t.splice(0, t.length - 180);
                    window.__ballTrailTs = performance.now();
                    window.BALL_TRACKER_ENABLED = true;
                }
                }
            } catch {}
            }

            // clean stale handler then attach the real one for this run
            try { window.removeEventListener('analyzer:frame-done', window.__onFrameOnce); } catch {}
            window.__onFrameOnce = onFrame;
            window.addEventListener('analyzer:frame-done', onFrame);




            async function tick() {
                if (!window.__FBF_ACTIVE) return;
                try {
                    cap.width = v.videoWidth || 1280;
                    cap.height = v.videoHeight || 720;
                    ctx.drawImage(v, 0, 0, cap.width, cap.height);

                    const raw = await window.sendFrameToDetect(cap, 1);
                    window.__detectFrameCount = (window.__detectFrameCount || 0) + 1;

                    const arr = Array.isArray(raw) ? raw : (raw.objects || raw.detections || []);
                    const ball = arr.find(o => String(o.label || o.class || o.name).toLowerCase().includes('ball'));
                    if (ball) {
                        const { cx, cy } = toCenter(ball, cap.width, cap.height);
                        if (Number.isFinite(cx) && Number.isFinite(cy)) {
                            const t = (window.__ballTrail ||= []);
                            t.push({ x: cx, y: cy, t: performance.now() });
                            if (t.length > 160) t.splice(0, t.length - 160);
                            window.__ballTrailTs = performance.now();
                            window.BALL_TRACKER_ENABLED = true;
                        }
                    }
                } catch { }
                setTimeout(tick, 60);
            }

            function startLoop() {
                if (window.__FBF_ACTIVE) return;
                window.__FBF_ACTIVE = true;
                tick();
            }
            function stopLoop() { window.__FBF_ACTIVE = false; }

            // Start when metadata is ready (frame size known) or on play.
            v.addEventListener('loadedmetadata', startLoop);
            v.addEventListener('play', startLoop);
            v.addEventListener('pause', stopLoop);
            v.addEventListener('ended', stopLoop);

            // DO NOT auto-play here. Let the Process click call play().
            // v.muted = true;  // you can still set these in the Process handler
            // v.play?.().catch(()=>{});

            clearInterval(window.__detBeat);
            window.__detBeat = setInterval(() => console.log(
                '[beat] calls', window.__detectFrameCount || 0,
                'trail', window.__ballTrail?.length || 0,
                'active', !!window.__FBF_ACTIVE,
                'paused', v.paused
            ), 1000);

            // allow Process to rebind after it swaps src or element
            window.rebindArcLoop = function (videoEl) {
                stopLoop();
                videoEl.addEventListener('loadedmetadata', startLoop, { once: true });
                // if it’s already ready, start immediately
                if (videoEl.readyState >= 1) startLoop();
            };

            console.log('[arc-mm] FBF detector feed installed (safe)');
        })();

        // Lock view scaling exactly once per clip to stop per-frame resize jitter
        function lockViewOnce(videoEl, overlay) {
            if (window.__VIEW && window.__VIEW.__locked) return;
            const vw = videoEl.videoWidth || 1280;
            const vh = videoEl.videoHeight || 720;
            overlay.width = vw;
            overlay.height = vh;
            window.__VIEW = { vw, vh, sx: 1, sy: 1, scale: 1, __locked: true };
            // If something tries to re-sync sizes, ignore it until this clip ends
            window.syncSizesOnce = function () { /* locked */ };
        }




        /* ---------- boot UI (idempotent, sequential, sane) ---------- */
        (function bootOnce() {
            if (window.__bootWired) return; window.__bootWired = true;

            // tiny helper: wait for this shot to complete (summary or end)
            function waitForShotDone() {
                const requireFull = window.arcmmRunner?.forceFullRun === true;
                return new Promise(resolve => {
                    const cleanup = () => {
                        window.removeEventListener('shot:summary', onShotSummary);
                        window.removeEventListener('shot:end', onShotEnd);
                        window.removeEventListener('arcmm:result', onArcmmResult);
                    };
                    const resolveWith = (tag, ev) => {
                        cleanup();
                        resolve(tag || ev?.type || 'shot:end');
                    };
                    const onShotSummary = (ev) => {
                        if (requireFull) return;
                        resolveWith('shot:summary', ev);
                    };
                    const onShotEnd = (ev) => {
                        if (requireFull) {
                            const via = String(ev?.detail?.via || '').toLowerCase();
                            if (via !== 'fbf-90' && via !== 'frame-limit') return;
                        }
                        resolveWith('shot:end', ev);
                    };
                    const onArcmmResult = (ev) => resolveWith('arcmm:result', ev);
                    window.addEventListener('shot:summary', onShotSummary);
                    window.addEventListener('shot:end', onShotEnd);
                    if (requireFull) {
                        window.addEventListener('arcmm:result', onArcmmResult, { once: true });
                    }
                });
            }

            async function maybeAutoStart() {
                const cfg = g.arcmmRunner;
                if (!cfg || !cfg.autoStart) return;
                const mode = cfg.mode || (cfg.shots && cfg.shots.length <= 1 ? 'single' : 'all');
                cfg.autoStart = false;
                await new Promise(r => setTimeout(r, cfg.startDelayMs || 50));
                if (mode === 'single') {
                    const first = ui.list.querySelector('.shot button.go');
                    if (first && !first.disabled) {
                        await handleOneButtonClick(first);
                    }
                } else {
                    const buttons = [...ui.list.querySelectorAll('.shot button.go')].filter(b => !b.disabled);
                    for (const btn of buttons) {
                        await handleOneButtonClick(btn);
                    }
                }
            }

            function renderList() {
                const shots = (typeof SHOTS !== 'undefined' && Array.isArray(SHOTS)) ? SHOTS : [];
                ui.list.innerHTML = shots.map(s => `
        <div class="shot" data-shot="${s.id}">
            <button class="btn go" data-id="${s.id}">Process</button>
            <span class="status">waiting…</span>
            <span class="name">${s.name || s.url}</span>
        </div>
        `).join('');
                maybeAutoStart();
            }

            async function ensurePlayable(videoEl) {
                if (!videoEl) return;
                videoEl.muted = true;
                videoEl.playsInline = true;
                videoEl.setAttribute('playsinline', '');
                videoEl.crossOrigin = 'anonymous';
                videoEl.preload = 'auto';

                const p = videoEl.play?.();
                if (p && p.catch) {
                    await p.catch(() => {
                        const unlock = () => {
                            videoEl.play().catch(() => { });
                            window.removeEventListener('pointerdown', unlock, { capture: true });
                        };
                        window.addEventListener('pointerdown', unlock, { once: true, capture: true });
                    });
                }
            }

            async function handleOneButtonClick(b) {
                if (!b || b.disabled) return;
                b.disabled = true; b.textContent = 'Processing…';
                const row = b.closest('.shot');
                const id = b.dataset.id;
                const shot = SHOTS.find(x => String(x.id) === String(id));
                const st = row?.querySelector('.status');

                try {
                    st && (st.textContent = 'running…');
                    // headless deterministic pipeline; returns once driver is started
                    const baseName =
                        (typeof shot.outBasename === 'string' && shot.outBasename.trim())
                            ? shot.outBasename.trim()
                            : (typeof shot.downloadName === 'string' && shot.downloadName.trim()
                                ? shot.downloadName.trim()
                                : `shot-${shot.id}`);
                    await renderResultsClip({ id: shot.id, url: shot.url, outBasename: baseName });
                    // now wait for this shot to actually finish (summary or end)
                    await waitForShotDone();
                } catch (err) {
                    console.error('[boot] clip failed:', err);
                    st && (st.textContent = 'error');
                } finally {
                    // button stays disabled after run; status will be set by finishNow()
                    b.textContent = 'Done';
                }
            }

            // Click handler: Shift-click = PREVIEW (plays video), plain click = PROCESS (FBF)
            ui.list.addEventListener('click', async (e) => {
                const b = e.target.closest('button.go');
                if (!b || b.disabled) return;

                const row = b.closest('.shot');
                const id = b.dataset.id;
                const shot = SHOTS.find(x => String(x.id) === String(id));
                const st = row?.querySelector('.status');
                const v = ui.video;

                if (e.shiftKey) {
                    // PREVIEW mode: play the clip and rebind detector loop immediately
                    try {
                        // PREVIEW mode: play the clip and rebind detector loop immediately
                        b.textContent = 'Previewing…';
                        st && (st.textContent = 'playing…');

                        v.pause();
                        v.srcObject = null;
                        v.removeAttribute('src');
                        v.src = shot.url;
                        v.load();

                        // ▶ reset all live trail buffers for this clip
                        window.__ballTrail = [];
                        if (window.ballState) window.ballState.trail = [];
                        window.__ballTrailTs = 0;
                        // optional hygiene
                        try { window.shotArc?.resetShotFSM?.(); } catch { }
                        try { window.resetNetMotion?.(); } catch { }

                        await ensurePlayable(v);        // call play() in the same user gesture
                        window.rebindArcLoop?.(v);
                        b.textContent = 'Process';

                    } catch (err) {
                        console.warn('preview failed', err);
                        st && (st.textContent = 'preview failed');
                        b.textContent = 'Process';
                    }
                    return; // don’t start FBF on preview
                }

                // PROCESS mode: run deterministic FBF pipeline (no native playback)
                handleOneButtonClick(b);
            });


            // Process all, sequentially, with progress
            let processingAll = false;
            ui.processAllBtn.onclick = async () => {
                if (processingAll) return;
                processingAll = true;
                const orig = ui.processAllBtn.textContent;
                ui.processAllBtn.disabled = true;

                try {
                    const buttons = [...ui.list.querySelectorAll('.shot button.go')];
                    const total = buttons.length;
                    for (let i = 0; i < total; i++) {
                        const b = buttons[i];
                        ui.processAllBtn.textContent = `Processing ${i + 1} / ${total}…`;
                        if (!b.disabled) {
                            await handleOneButtonClick(b);
                        }
                    }
                    ui.processAllBtn.textContent = 'All done';
                } catch (e) {
                    console.error('[boot] process all failed:', e);
                    ui.processAllBtn.textContent = 'Error – retry';
                } finally {
                    setTimeout(() => {
                        ui.processAllBtn.disabled = false;
                        ui.processAllBtn.textContent = orig;
                        processingAll = false;
                    }, 1000);
                }
            };

            function boot() { renderList(); }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot, { once: true });
            } else {
                boot();
            }
            try {
                if (g.arcmmRunner) {
                    g.arcmmRunner.ready = true;
                    g.arcmmRunner.shotsRendered = true;
                    g.arcmmRunner.onReady?.({ shots: SHOTS.slice() });
                }
            } catch { }
        })();

    </script>


    <script>
        /* ---------- prox tail freezer (stable, resets per clip) ---------- */
        (function wireProxTail() {
            if (window.__proxTailWired) return; window.__proxTailWired = true;

            window.__resetProxTail = function __resetProxTail() {
                window.__proxTail = [];
                ended = false;
            };

            let ended = false;
            window.__resetProxTail();

            const stop = () => { ended = true; };
            window.addEventListener('shot:end', stop, { once: true });
            window.addEventListener('shot:summary', stop, { once: true });

            function onAnyFrame() {
                if (ended) return;
                try {
                    const bs = window.ballState || {};
                    const trail = Array.isArray(bs.trail) ? bs.trail : [];
                    const last = trail.length ? trail[trail.length - 1] : null;
                    if (!last || !Number.isFinite(last.frame)) return;

                    const enter = Number(bs.proxEnterFrame);
                    const exit = (bs.proxExitFrame == null) ? null : Number(bs.proxExitFrame);

                    const inWindow = Number.isFinite(enter)
                        && last.frame >= enter
                        && (exit == null || last.frame <= exit + 2);

                    if (!inWindow) return;

                    const buf = (window.__proxTail ||= []);
                    if (!buf.length || buf[buf.length - 1].frame !== last.frame) buf.push(last);
                } catch { }
            }

            // listen to both, some paths emit only one
            window.addEventListener('video:frame', onAnyFrame, { passive: true });
            window.addEventListener('analyzer:frame-done', onAnyFrame, { passive: true });
        })();

    </script>
