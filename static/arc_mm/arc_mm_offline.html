<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Arc & Make/Miss — Offline</title>
  <style>
    body { background:#111; color:#eee; font-family:system-ui, sans-serif; }
    #stage { position: relative; width: 960px; aspect-ratio: 16/9; background:#000; margin-top:12px; }
    #stage > * { position:absolute; inset:0; display:block; }
    #controls { display:flex; gap:12px; align-items:center; margin-bottom:8px; }
    #shotList .shot { margin: 6px 0; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="arcmm">
    <h2>Arc & Make/Miss (Detectorless)</h2>

    <div id="controls">
      <button id="processAll">Process All</button>
    </div>

    <div id="shotList"></div>

    <div id="stage">
      <video id="mmVideo" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <canvas id="exportCanvas"></canvas>
    </div>
  </div>

  <script>
    // Demo list; adjust to your session folder
    const sid  = "20250930_204140_927675";
    const base = `/static/arc_mm/sessions/${sid}/clips`;
    window.__DEMO_SHOTS = Array.from({ length: 10 }, (_, i) => {
      const n = i + 1;
      return { id: `${sid}-${n}`, name: `shot-${n}.webm`, url: `${base}/shot-${n}.webm` };
    });
    window.__videoFPS = 30;
  </script>

  <script type="module" src="/static/arc_mm/arc_mm_offline.js"></script>
</body>
</html>
