  <script>  // debug flags (set before app.js)
  window.__LOCAL_DETECTOR = false;   // don't spin up detector.worker.js
  window.__forceServerDetect = true; // route to server
  window.PD_PREFETCH_FPS = 10;       // throttle pre-detect to ~10 fps
  window.__forceServerDetect = false; window.__LOCAL_DETECTOR = false;
  window.DEBUG_FORCE_POSE_ACTIVE = true
  window.DEBUG_FORCE_HOOP_LOCKED = true
  window.DEBUG_FORCE_SESSION_ACTIVE = true
  window.POSE_DEBUG = true; window.DOACH_RELEASE_TRACE = true
  window.REL_SCORE_THRESH = 0.55
  PREF_LIVE_TIPS = true
  </script>  <!-- end debug flags -->

  <!-- Early global guard: swallow pre-hoop or unstable pose releases -->
  <script>
    (function installEarlyReleaseGuard(){
      try {
        if (window.__earlyRelGuard) return; window.__earlyRelGuard = true;
        window.addEventListener('shot:release', (e) => {
          try {
            const hoopLocked = !!(window.getLockedHoopBox && window.getLockedHoopBox());
            const confirmed  = (window.__hoopConfirmed === true);
            const armed      = (window.__shotTrackingArmed === true);
            if (!hoopLocked || !confirmed || !armed) { e.stopImmediatePropagation(); return; }
          } catch {}
        }, true);
      } catch {}
    })();
  </script>

  <!-- Core app/scripts (load each ONCE) -->
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/video_ui.js"></script>
  <script type="module" src="/static/js/session_manager.js"></script>
  <script type="module" src="/static/js/coach_voice.js"></script>
  <script type="module" src="/static/js/coachAssistant.js"></script>

  <script>
    // Conditionally load auto probe tools via query param ?probe=release
    (function(){ try { var q=new URLSearchParams(location.search||''); if((q.get('probe')||'').toLowerCase()==='release'){ var s=document.createElement('script'); s.type='module'; s.src='/static/js/auto_probe_release.js'; document.head.appendChild(s);} } catch(e){} })();
  </script>

  <!-- Core libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
  <!-- Lottie for splash animation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <!-- Early shims: provide globals the tests probe before modules load -->
  <script>
    (function bootEarlyGlobals(){
      try {
        const isPW = !!(navigator.webdriver) || /playwright|headless/i.test(navigator.userAgent||'');
        const urlHasE2E = /__e2e=1/.test(location.search||'');
        window.__TEST_MODE = isPW || urlHasE2E;
      } catch { window.__TEST_MODE = false; }
      // E2E-friendly release/exit tuning
      try {
        window.RELEASE_DELAY_FRAMES   = 1;
        window.REL_HAND_DIST_PX       = 120;
        window.REL_POSE_STREAK        = 1;
        window.REL_UPWARD_MIN_FRAMES  = 1;
        window.EXIT_LINGER_FRAMES     = 8;
        window.EXIT_BELOW_MARGIN      = 12;
        window.proxX                  = 200;
        window.proxYAbove             = 170;
        window.proxYBelow             = 100;
      } catch {}
      // Prefer a dense slow-pass during shot windows for backend accuracy
      try {
        // Backend pre-roll cadence (analyzer pump when paused)
        window.__PREROLL_FPS = window.__PREROLL_FPS || 10;
        // Test-mode hardening: denser backend, ROI-only, server detect
        if (window.__TEST_MODE) {
          window.FBF_VISUAL_FPS = 10;
          window.FBF_MIN_FRAMES = 48;         // ensure long sampling window
          window.__forceServerDetect = true;
          window.DETECT_ROI_ONLY = true;
          window.__ROI_DETECT_ALWAYS = true;
          window.ARC_SMOOTH = true;
        }
      } catch {}

      // Overlay helpers: minimal no-op-safe fallbacks (replaced by module later)
      if (typeof window.ensureOverlayCss !== 'function') {
        window.ensureOverlayCss = function ensureOverlayCssFallback() {
          try {
            const ov  = document.getElementById('overlay');
            const vid = document.getElementById('videoPlayer');
            if (!ov || !vid) return;
            const anchor = vid.parentElement || document.body;
            if (getComputedStyle(anchor).position === 'static') anchor.style.position = 'relative';
            ov.style.position = 'absolute'; ov.style.left = '0'; ov.style.top  = '0';
            ov.style.userSelect = 'none'; ov.style.pointerEvents = 'none'; ov.style.zIndex = '100';
          } catch {}
        };
      }
      if (typeof window.lockOverlayToVideo !== 'function') {
        window.lockOverlayToVideo = function lockOverlayToVideoFallback() {
          try {
            const ov  = document.getElementById('overlay');
            const vid = document.getElementById('videoPlayer');
            if (!ov || !vid) return;
            const r = vid.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            ov.width  = Math.max(1, Math.round((vid.videoWidth  || r.width)  * dpr));
            ov.height = Math.max(1, Math.round((vid.videoHeight || r.height) * dpr));
          } catch {}
        };
      }

      // Analyzer: stub that defers to real implementation once loaded
      if (typeof window.analyzeVideoFrameByFrame !== 'function') {
        window.analyzeVideoFrameByFrame = function analyzerDeferred(v, c) {
          // Attempt immediate handoff if real impl already present
          const real = (window.__realAnalyzeVideoFrameByFrame || window.legacyAnalyzeVideoFrameByFrame);
          if (typeof real === 'function') { try { return real(v, c); } catch {} }
          // Kick a fast poll to start once available
          let tries = 0;
          const t = setInterval(() => {
            const fn = (window.__realAnalyzeVideoFrameByFrame || window.legacyAnalyzeVideoFrameByFrame);
            if (typeof fn === 'function' || ++tries > 80) {
              clearInterval(t);
              if (typeof fn === 'function') { try { fn(v, c); } catch {} }
            }
          }, 50);
          // Nudge: dynamically import analyzer to hurry availability
          try {
            import('/static/js/analyzer.js').then(m => {
              try { (window.__bootLog ||= []).push('analyzer_import_ok'); } catch {}
              if (typeof m?.analyzeVideoFrameByFrame === 'function') {
                window.__realAnalyzeVideoFrameByFrame = m.analyzeVideoFrameByFrame;
              }
            }).catch((e) => { try { (window.__bootLog ||= []).push('analyzer_import_err:' + (e?.message||e)); } catch {} });
          } catch (e) { try { (window.__bootLog ||= []).push('analyzer_import_throw:' + (e?.message||e)); } catch {} }
        };
      }
    })();
  </script>

  <!-- MediaPipe Pose Model -->

<body>

    position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10060;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:16px;">
      <button id="btnStartLive" style="
        font:700 22px system-ui, -apple-system, Segoe UI, Arial; padding:16px 24px; border-radius:14px; border:1px solid rgba(255,255,255,.18);

        background: rgba(17,28,46,.82); color:#fff; cursor:pointer; box-shadow:0 8px 28px rgba(0,0,0,.32);">Start Challenge Session</button>
      <div id="challengeBtnNote" style="display:none; font:500 12px system-ui; text-align:center; color:#f6d365; max-width:320px;"></div>
    </div>
  </div>

  <div id="authOverlay" style="
    position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:10060;">
    <div id="authCard" style="
      width:min(92%, 520px); background: rgba(0,0,0,.88); color:#fff; border:1px solid rgba(255,255,255,.12);

  <!-- Overlay Prompt Message -->

  <!-- ✅ Main Video + Overlay -->

      <video id="videoPlayer" muted playsinline></video>
      <canvas id="overlay"></canvas>

  <!-- ✅ Coach Feedback + Shot Summary -->
  <div id="coachNotes" style="
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    max-width: 520px; background: rgba(0,0,0,0.7); color: #fff;
    padding: 10px 14px; border-radius: 8px; text-align: center;
    font-size: 14px; line-height: 1.4; z-index: 900; pointer-events: none;">
    <strong>🤖 Coach Feedback</strong><br>
    <span style="color:gray;">(No shot yet)</span>
  </div>

  <div id="shotOverlaySummary" style="
    position: absolute;
    bottom: 80px;
    right: 20px;
    padding: 10px 16px;
    background: rgba(0,0,0,0.75);

    border-radius: 10px;
    font-size: 14px;

    transition: opacity 0.4s ease;

    display: none;"></div>

  <!-- Hidden upload control the new “Content” menu will click -->

  <!-- Mount the new Hamburger menu + Feedback widget -->
  <script type="module">
    import { installFeedbackWidget } from '/static/js/feedback_widget.js';
    window.addEventListener('DOMContentLoaded', () => installFeedbackWidget());
  </script>


  <!-- (Keep) lightweight helpers already on the page -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const promptOverlay = document.getElementById("overlayPrompt");

      window.showPrompt = (message) => {
        promptOverlay.textContent = message;
        promptOverlay.style.display = "block";
      };
      window.hidePrompt = () => { promptOverlay.style.display = "none"; };

      window.lockHoop = function () {
        hidePrompt();
        console.log("✅ Hoop lock UI confirmed");
      };

      window.endSession = () => {
        try { window.autoEndSessionAndSummarize?.(); }
        catch { alert('✅ Session ended.'); }
      };
    });
  </script>

  <script>
    function startNativeVoice() {
      window.webkit?.messageHandlers?.doach?.postMessage({ action: 'startVoice' });
    }
    function stopNativeVoice() {
      window.webkit?.messageHandlers?.doach?.postMessage({ action: 'stopVoice' });
    }
    </script>

    

<!-- ui menu (classic, auto-mounts) -->
<script src="/static/js/ui_menu.js?v=2"></script>

  <!-- Early bootstrap: expose overlay helpers + analyzer global before app.js -->
  <script type="module">
    // Import overlay helpers first; the module binds window.ensureOverlayCss/lockOverlayToVideo
    try {
      await import('/static/js/fix_overlay_display.js');
      // default to coach: show pose + hoop only
      try { window.setOverlayMode?.('coach'); } catch {}
    } catch (e) {
      console.warn('[boot] overlay helpers failed to import early', e);
    }
    // Import analyzer and bind legacy global expected by tests
    try {
      const mod = await import('/static/js/analyzer.js');
      if (mod?.analyzeVideoFrameByFrame) {
        window.analyzeVideoFrameByFrame = mod.analyzeVideoFrameByFrame;
      }
    } catch (e) {
      console.warn('[boot] analyzer failed to import early', e);
    }

    // Dev/CI: auto‑start background FBF plane when running automation or ?__bg=1
    try {
      const isBG = /[?&]__bg=1/.test(location.search) || (window.__TEST_MODE === true);
      if (isBG) {
        window.__BG_ONLY = true;
        window.__PREROLL_FPS = window.__PREROLL_FPS || 10;
        window.__forceServerDetect = true;      // prefer backend YOLO for accuracy
        window.DETECT_ROI_ONLY = true;
        window.__ROI_DETECT_ALWAYS = true;
        // Load development HUD for BG plane
        try { await import('/static/js/bg_hud.js'); } catch {}
        const bootBG = () => {
          const v = document.getElementById('videoPlayer');
          const ov = document.getElementById('overlay');
          if (!v || !ov) return;
          const syncWH = () => { try { ov.width = v.videoWidth || ov.width || 1280; ov.height = v.videoHeight || ov.height || 720; } catch {} };
          if (v.readyState >= 2) { syncWH(); }
          else {
            v.addEventListener('loadedmetadata', syncWH, { once: true });
            v.addEventListener('canplay', syncWH, { once: true });
          }
          try { window.analyzeVideoFrameByFrame?.(v, ov); } catch {}
          try { v.pause(); } catch {}
        };
        if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', bootBG); else bootBG();
      }
    } catch {}
  </script>

  <!-- app entry (ESM) imports the rest of the modules -->
  <script type="module" src="/static/js/app.js"></script>
  <script type="module" src="/static/js/session_manager.js"></script>

  <!-- Splash + Auth bootstrap -->
  <script>
    (function bootSplashAndAuth(){
      const splash = document.getElementById('splashOverlay');
      const lottieDiv = document.getElementById('lottieSplash');
      // try {
      //   if (window.lottie && lottieDiv) {
      //     const anim = lottie.loadAnimation({ container: lottieDiv, renderer: 'svg', loop: false, autoplay: true, path: '/static/GlowingYellow%202.json' });
      //   }
      // } catch {}

      const showStart = () => { try { document.getElementById('startSessionOverlay').style.display = 'flex'; } catch {} };
      const hideStart = () => { try { document.getElementById('startSessionOverlay').style.display = 'none'; } catch {} };
      const showAuth  = () => { try { document.getElementById('authOverlay').style.display = 'flex'; } catch {} };
      const hideAuth  = () => { try { document.getElementById('authOverlay').style.display = 'none'; } catch {} };
      const setAuthBody = (html) => { try { document.getElementById('authBody').innerHTML = html; } catch {} };
      const setAuthTitle= (txt)  => { try { document.getElementById('authTitle').textContent = txt; } catch {} };

      // Login form
      function renderLogin(){
        setAuthTitle('Login to Doach');
        setAuthBody(`
          <div style="display:grid; gap:10px">
            <input id="lg_email" type="email" placeholder="Email" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <input id="lg_password" type="password" placeholder="Password" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <button id="btnDoLogin" style="padding:12px;border-radius:10px;border:0;background:#ffcc33;color:#111;font:700 14px system-ui;cursor:pointer">Login</button>
            <button id="btnShowSignup" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font:600 13px system-ui;cursor:pointer">Sign up Now</button>
            <div id="authMsg" style="min-height:18px;color:#f88;font:600 12px system-ui"></div>
          </div>`);
        document.getElementById('btnShowSignup').onclick = renderSignup;
        document.getElementById('btnDoLogin').onclick = async () => {
          const email = document.getElementById('lg_email').value.trim();
          const password = document.getElementById('lg_password').value;
          try {
            const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
            const j = await r.json(); if (!r.ok) throw new Error(j.error||'Login failed');
            localStorage.setItem('firstname', j.name || 'player'); hideAuth(); showStart();
          } catch (e) { document.getElementById('authMsg').textContent = e.message || 'Login failed'; }
        };
      }

      // Signup form (extended)
      function renderSignup(){
        setAuthTitle('Create Your Account');
        setAuthBody(`
          <div style="display:grid; gap:10px">
            <input id="su_name"  placeholder="Name" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <div style="display:flex; gap:8px">
              <input id="su_birth_mm" placeholder="MM" style="flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
              <input id="su_birth_dd" placeholder="DD" style="flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
              <input id="su_birth_yy" placeholder="YYYY" style="flex:2;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            </div>
            <input id="su_email" type="email" placeholder="Email" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <input id="su_phone" placeholder="Phone" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <div style="display:flex; gap:8px">
              <input id="su_height_ft" placeholder="Height ft" style="flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
              <input id="su_height_in" placeholder="in" style="flex:1;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            </div>
            <select id="su_hand" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
              <option value="right">Right</option>
              <option value="left">Left</option>
              <option value="both">Both</option>
            </select>
            <select id="su_exp" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
              <option>beginner</option>
              <option>recreational</option>
              <option>intermediate</option>
              <option>advanced</option>
              <option>competitive</option>
              <option>elite</option>
            </select>
            <input id="su_pw" type="password" placeholder="Password" style="padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#111;color:#fff">
            <button id="btnDoSignup" style="padding:12px;border-radius:10px;border:0;background:#ffcc33;color:#111;font:700 14px system-ui;cursor:pointer">Create Account</button>
            <button id="btnShowLogin" style="padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font:600 13px system-ui;cursor:pointer">Back to Login</button>
            <div id="authMsg" style="min-height:18px;color:#f88;font:600 12px system-ui"></div>
          </div>`);
        document.getElementById('btnShowLogin').onclick = renderLogin;
        document.getElementById('btnDoSignup').onclick = async () => {
          const name = document.getElementById('su_name').value.trim();
          const email= document.getElementById('su_email').value.trim();
          const password = document.getElementById('su_pw').value;
          const profile = {
            name,
            birthdate: `${document.getElementById('su_birth_mm').value}/${document.getElementById('su_birth_dd').value}/${document.getElementById('su_birth_yy').value}`,
            phone: document.getElementById('su_phone').value.trim(),
            height: `${document.getElementById('su_height_ft').value}ft ${document.getElementById('su_height_in').value}in`,
            hand: document.getElementById('su_hand').value,
            experience: document.getElementById('su_exp').value
          };
          try {
            const r = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, password }) });
            const j = await r.json(); if (!r.ok) throw new Error(j.error||'Register failed');
            localStorage.setItem('doachProfile', JSON.stringify(profile));
            localStorage.setItem('firstname', profile.name || 'player');
            hideAuth(); showStart();
          } catch (e) { document.getElementById('authMsg').textContent = e.message || 'Register failed'; }
          try { await window.prefetchChallengeState?.(); } catch {}
        };
      }

      // Check auth and show next view after splash (3s)
      function afterSplash(){
        fetch('/api/auth/me').then(r=>r.json()).then(j=>{
          try { splash.style.display = 'none'; } catch {}
          const user = j && j.user;
          if (user) { showStart(); try { window.prefetchChallengeState?.(); } catch {} }
          else { showAuth(); renderLogin(); }
        }).catch(()=>{ try { splash.style.display='none'; } catch {}; showAuth(); renderLogin(); });
      }
      setTimeout(afterSplash, 3000);

      // Start Session wiring
      try {
        document.getElementById('btnStartLive').onclick = async () => {
          try { hideStart(); } catch {}
          try {
            // Ensure a backend session row exists so admin sees it immediately
            if (!window.__SESSION_ID) {
              const r = await fetch('/api/sessions/start', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ device: navigator.userAgent }) });
              if (r.ok) { const j = await r.json(); window.__SESSION_ID = j.id; window.__SHOT_IDX = 0; }
            }
          } catch {}
          try {
            await window.primeCoachAudio?.();
          } catch {}
          try {
            // Prefer immediate camera start; then trigger session HUD start
            if (window.startCamera) await window.startCamera();
          } catch {}
          try { window.dispatchEvent(new CustomEvent('hud:start-session')); } catch {}
        };
      } catch {}
    })();
  </script>

<!-- local detector enable (ESM) -->
<script type="module">
  (async () => {
    if (!window.localDetector) {
      console.warn('[LocalDetector] not loaded; using server detector.');
      return;
    }
    try {
      const ok = await window.localDetector.enable(
        '/static/models/best.onnx',
        ['basketball','hoop','net','backboard','player']
      );
      console.log(ok ? '✅ Local detector enabled' : '⬇️ Using server detector');
    } catch (e) {
      console.warn('[LocalDetector] init failed; using server detector.', e);
    }
  })();
</script>
