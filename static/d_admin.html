<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Doach Admin</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; font:14px/1.4 system-ui, -apple-system, Segoe UI, Arial; background:#0b0f14; color:#e6edf3; min-height:100vh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:#0f1621; border-bottom:1px solid #1f2a36; flex-shrink:0; }
    h1 { font-size:18px; margin:0; }
    main { display:grid; grid-template-columns:380px 1fr; gap:14px; padding:14px; flex:1 1 auto; box-sizing:border-box; min-height:0; height:calc(100vh - 96px); }
    section { background:#0f1621; border:1px solid #1f2a36; border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-height:0; max-height:100%; }
    section > h2 { font-size:14px; margin:0; padding:10px 12px; background:#111a25; border-bottom:1px solid #1f2a36; flex-shrink:0; }
    .list { padding:8px; overflow:auto; flex:1 1 auto; }
    .row { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #16202b; cursor:pointer; transition:background 0.2s ease, border-left 0.2s ease; }
    .row:hover { background:#0d131c; }
    .row.active { background:#122819; border-left:4px solid #2dd683; }
    .row.active:hover { background:#163121; }
    .row-live { border-left:4px solid #f97316; }
    .row.selected { outline:1px solid #2563eb; }
    .session-main { flex:1; display:flex; flex-direction:column; gap:2px; }
    .session-meta { text-align:right; font-size:12px; }
    .info-line { font-size:12px; }
    .pill-live { display:inline-block; margin-left:6px; font-size:11px; padding:2px 6px; border-radius:999px; border:1px solid #f97316; background:#431407; color:#fb923c; text-transform:uppercase; letter-spacing:0.05em; }
    .muted { opacity:.8; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:700; font-size:12px; }
    .ok { background:#11331f; color:#34d399; border:1px solid #1e7a42; }
    .bad { background:#2a1111; color:#f87171; border:1px solid #7a1e1e; }
    .pending { background:#1c1b24; color:#d1d5db; border:1px solid #54535c; }
    .btn { background:#1a2533; color:#dbe5ee; border:1px solid #283241; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .btn:hover { background:#223144; }
    .toolbar { display:flex; gap:8px; align-items:center; }
    .debug-header { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .debug-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    #dbg-json { background:#0b0f12; color:#cfe8ff; border:1px solid #2a6; border-radius:8px; padding:12px; margin:0; flex:1 1 auto; min-height:240px; max-height:48vh; overflow:auto; font:12px/1.4 monospace; }
    .shots-wrap { margin-top:16px; }
    .shots-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .shots-header h3 { margin:0; font-size:14px; }
    .shots-meta { font-size:12px; color:#94a3b8; }
    .shots-table { width:100%; border-collapse:collapse; font-size:12px; }
    .shots-table th, .shots-table td { padding:6px 8px; border-bottom:1px solid #1f2a36; text-align:left; vertical-align:top; }
    .shots-table tbody tr:hover { background:#101a29; }
    .clip-link { color:#7dd3fc; text-decoration:none; }
    .clip-link:hover { text-decoration:underline; }
    .clip-link-disabled { color:#94a3b8; pointer-events:none; text-decoration:none; }
    .arcmm-cell { min-width:210px; }
    .arcmm-status { display:flex; flex-direction:column; gap:4px; }
    .arcmm-line { font-size:12px; line-height:1.35; }
    .arcmm-pill { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:600; font-size:11px; border:1px solid transparent; text-transform:uppercase; letter-spacing:0.05em; }
    .arcmm-pill.ok { background:#11331f; color:#34d399; border-color:#1e7a42; }
    .arcmm-pill.pending { background:#1c1b24; color:#d1d5db; border-color:#54535c; }
    .arcmm-pill.bad { background:#2a1111; color:#f87171; border-color:#7a1e1e; }
    .arcmm-pill.muted { background:#10131a; color:#94a3b8; border-color:#2c3440; }
    .arcmm-metrics { color:#cbd5f5; }
    .arcmm-message { color:#fbbf24; }
    .arcmm-message::before { content:"WARN: "; font-weight:600; }
    .arcmm-overlay-link { color:#7dd3fc; text-decoration:none; }
    .arcmm-overlay-link:hover { text-decoration:underline; }
    .arcmm-updated { color:#64748b; font-style:italic; }
    .shots-empty { padding:10px; font-style:italic; color:#94a3b8; border:1px dashed #2a3a4a; border-radius:8px; }
    .shots-pill { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:600; font-size:11px; border:1px solid transparent; text-transform:uppercase; letter-spacing:0.04em; }
    .shots-pill.make { border-color:#1e7a42; background:#11331f; color:#34d399; }
    .shots-pill.miss { border-color:#7a1e1e; background:#2a1111; color:#f87171; }
    .shots-pill.pending { border-color:#54535c; background:#1c1b24; color:#d1d5db; }
    #sessionPane { display:flex; flex-direction:column; min-height:0; max-height:100%; }
    #sessionPane .list { max-height:100%; overflow-y:auto; }
    #sessionsList { max-height:100%; overflow-y:auto; }
    #viewer { flex:1 1 auto; display:flex; flex-direction:column; align-items:stretch; justify-content:flex-start; padding:10px; min-height:0; }
    iframe { width:100%; height:100%; border:none; border-radius:10px; background:#0b0f14; min-height:0; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px; flex-shrink:0; }
    pre { background:#0b0f14; border:1px solid #1f2a36; border-radius:8px; padding:8px; overflow:auto; max-height:320px; }
    input[type="text"] { background:#0b0f14; color:#e6edf3; border:1px solid #1f2a36; padding:6px 8px; border-radius:8px; width:200px; }
    @media (max-width: 1040px) {
      main { grid-template-columns:1fr; }
      #viewer { min-height:320px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Doach Admin</h1>
    <div class="toolbar">
      <input id="filterTxt" type="text" placeholder="Filter sessions..."/>
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>
  </header>
  <main>
    <section id="sessionPane">
      <h2>Sessions</h2>
      <div class="list" id="sessionsList"></div>
    </section>
    <section>
      <h2>Details</h2>
      <div id="viewer">
        <div class="debug-header">
          <div>
            <h2 style="margin:0;">Doach Live Debug</h2>
            <div id="dbg-session-label" class="muted" style="font-size:12px;">No session selected.</div>
          </div>
          <div class="debug-actions">
            <button id="dbg-open-observe" disabled>Observe</button>
            <button id="dbg-open-json" disabled>Open JSON</button>
            <button id="adm-dbg-download" disabled>Download</button>
            <button id="dbg-copy" disabled>Copy</button>
          </div>
        </div>
        <pre id="dbg-json">(select a session to load debug details)</pre>
        <div class="shots-wrap">
          <div class="shots-header">
            <h3>Shots</h3>
            <span id="shotsMeta" class="shots-meta">0/0</span>
          </div>
          <div id="shotsTableWrap" class="shots-empty">Select a session to view shots.</div>
        </div>
      </div>



  <script src="/static/js/admin_dashboard.js"></script>
  <script src="/static/js/d_admin_opg.js"></script>
</body>
</html>
