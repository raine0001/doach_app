<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Doach Admin</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 14px/1.4 system-ui, -apple-system, Segoe UI, Arial; background:#0b0f14; color:#e6edf3; }
    header { display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; background:#0f1621; border-bottom:1px solid #1f2a36; position:sticky; top:0; z-index:2; }
    h1 { font-size: 18px; margin:0; }
    main { display: grid; grid-template-columns: 420px 1fr; gap: 14px; padding: 14px; }
    section { background:#0f1621; border:1px solid #1f2a36; border-radius: 10px; overflow:hidden; }
    section > h2 { font-size: 14px; margin:0; padding:10px 12px; background:#111a25; border-bottom:1px solid #1f2a36; }
    .list { padding: 8px; max-height: calc(100vh - 180px); overflow:auto; }
    .row { display:flex; align-items:center; gap:8px; padding:8px; border-bottom:1px solid #16202b; cursor:pointer; }
    .row:hover { background:#0d131c; }
    .muted { opacity: .8; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:700; font-size: 12px; }
    .ok { background:#11331f; color:#34d399; border:1px solid #1e7a42; }
    .bad{ background:#2a1111; color:#f87171; border:1px solid #7a1e1e; }
    .btn { background:#1a2533; color:#dbe5ee; border:1px solid #283241; padding:6px 10px; border-radius:8px; cursor:pointer; }
    .btn:hover { background:#223144; }
    .toolbar { display:flex; gap:8px; align-items:center; }
    #viewer { height: calc(100% - 44px); display:flex; align-items:center; justify-content:center; padding:10px; }
    iframe { width: 100%; height: 540px; border:none; border-radius:10px; background:#0b0f14; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
    pre { background:#0b0f14; border:1px solid #1f2a36; border-radius:8px; padding:8px; overflow:auto; max-height:320px; }
    input[type="text"] { background:#0b0f14; color:#e6edf3; border:1px solid #1f2a36; padding:6px 8px; border-radius:8px; width:200px; }
  </style>
</head>
<body>
  <header>
    <h1>Doach Admin</h1>
    <div class="toolbar">
      <input id="filterTxt" type="text" placeholder="Filter sessions…"/>
      <button class="btn" id="btnRefresh">Refresh</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Sessions</h2>
      <div class="list" id="sessionsList"></div>
    </section>
    <section>
      <h2>Details</h2>
      <div id="viewer">
        <div class="muted" style="max-width:560px; text-align:center;">
          <div style="margin-bottom:8px;">
            Select a session to view observer and debug.
          </div>
          <div style="text-align:left; background:#0b0f14; border:1px dashed #2a3a4a; padding:10px; border-radius:8px;">
            <strong>Tip</strong>: On the client, open DevTools and run:
            <pre>startObserverStreaming(2)</pre>
            Then open the Observe tab here.
          </div>
        </div>
      </div>
      <div class="grid">
        <div>
          <h3 style="padding:6px 10px; margin:0;">Debug JSON</h3>
          <pre id="debugJson">(none)</pre>
        </div>
        <div>
          <h3 style="padding:6px 10px; margin:0;">Active Users</h3>
          <pre id="activeUsers">(loading)</pre>
        </div>
      </div>
    </section>
  </main>
  <script>
    const elSessions = document.getElementById('sessionsList');
    const elViewer   = document.getElementById('viewer');
    const elDebug    = document.getElementById('debugJson');
    const elActive   = document.getElementById('activeUsers');

    async function fetchJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }

    function fmt(ts){
      if (!ts) return '—';
      try { const d = new Date(ts); return d.toLocaleString(); } catch { return String(ts); }
    }

    function rowHTML(s){
      const acc = Number.isFinite(s.accuracy) ? s.accuracy : (s.totals?.accuracy ?? null);
      const shots = s.shots ?? s.totals?.attempts ?? 0;
      const pill = acc != null ? `<span class="pill ${acc>=50?'ok':'bad'}">${acc}%</span>` : '';
      return `<div class="row" data-sid="${s.sid||s.id}">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700;">${s.sid||s.id}</div>
          <div class="muted">${fmt(s.created_at||s.startedAt)} → ${fmt(s.ended_at||s.endedAt)}</div>
        </div>
        <div class="muted">${shots} shots</div>
        ${pill}
        <button class="btn" data-act="observe">Observe</button>
        <button class="btn" data-act="debug">Debug</button>
      </div>`;
    }

    const __prevCounts = new Map();
    async function loadSessions(){
      const filt = (document.getElementById('filterTxt').value||'').toLowerCase();
      const data = await fetchJSON('/admin/sessions');
      const list = (data.sessions||[]).slice().sort((a,b)=>{
        const A = new Date(a.created_at||a.started_at||a.startedAt||0).getTime();
        const B = new Date(b.created_at||b.started_at||b.startedAt||0).getTime();
        return (B - A);
      });
      // detect increments
      list.forEach(s => {
        const k = s.sid||s.id; const n = s.shots||0; const p = __prevCounts.get(k)||0; s.__inc = (n>p); __prevCounts.set(k,n);
      });
      elSessions.innerHTML = list
        .filter(s => !filt || (s.sid||'').toLowerCase().includes(filt))
        .map(s => rowHTML(s).replace('</div></div>', `${s.__inc?'<span class="pill ok" style="margin-left:6px">live</span>':''}</div></div>`))
        .join('') || '<div class="muted" style="padding:10px;">No sessions.</div>';
    }

    async function loadActive(){
      try {
        const data = await fetchJSON('/admin/users');
        const txt = JSON.stringify({ users: data.users, active: data.active }, null, 2);
        elActive.textContent = txt;
      } catch (e) { elActive.textContent = '(error) '+e.message; }
    }

    elSessions.addEventListener('click', async (e) => {
      const row = e.target.closest('.row'); if (!row) return;
      const sid = row.getAttribute('data-sid');
      const act = e.target.getAttribute('data-act');
      if (act === 'observe') {
        elViewer.innerHTML = `<iframe src="/admin/observe/${sid}"></iframe>`;
        return;
      }
      if (act === 'debug') {
        try {
          const j = await fetchJSON(`/admin/session/${sid}/debug`);
          elDebug.textContent = JSON.stringify(j, null, 2);
          elViewer.innerHTML = `<div style="padding:10px;">
            <div style="margin-bottom:8px; font-weight:700;">${sid}</div>
            <a class="btn" href="/admin/observe/${sid}" target="_blank">Open Observe</a>
            <a class="btn" href="/admin/session/${sid}/debug" target="_blank">Open Debug JSON</a>
          </div>`;
        } catch (err) {
          elDebug.textContent = '(error) '+err.message;
        }
        return;
      }
    });

    document.getElementById('btnRefresh').onclick = () => { loadSessions(); loadActive(); };
    document.getElementById('filterTxt').oninput = () => { loadSessions(); };

    loadSessions(); loadActive();
    setInterval(loadSessions, 4000);
    setInterval(loadActive, 5000);
  </script>
</body>
</html>
